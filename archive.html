<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="DaizLab research archive: notes on intent systems, structured information and digital infrastructure."><title>Research Archive — DaizLab</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><a class="brand" href="/">DAIZLAB<span class="brand-dot">.</span></a><nav><a href="/">Home</a><a href="/arch.html">Architecture</a><a href="/haven/">Haven</a></nav></header><main class="wrap"><section class="page-hero"><p class="eyebrow">FIELD NOTES / RESEARCH</p><h1>The archive.</h1><p class="lead">Working notes on the systems behind meaningful digital action.</p></section><input class="field" id="search" placeholder="Search the archive…" aria-label="Search archive"><div id="tags"><button class="pill" data-tag="all">All</button><button class="pill" data-tag="intent">Intent</button><button class="pill" data-tag="systems">Systems</button><button class="pill" data-tag="design">Design</button></div><div id="entries"></div></main><footer class="footer"><a class="brand" href="/">DAIZLAB.</a><span>Research is iterative. Conclusions remain open to revision.</span></footer><script>const data=[{title:'Intent as an interface primitive',tag:'intent',desc:'Why the reason behind an action can be as important as the action itself.'},{title:'From human language to structured signals',tag:'systems',desc:'A practical view of translating unstructured requests into useful data.'},{title:'Designing for the next meaningful step',tag:'design',desc:'Interfaces that reduce friction without hiding the choices people make.'},{title:'Machine-readable by design',tag:'systems',desc:'Structured metadata as a bridge between people, products and software.'}];let active='all';const root=document.querySelector('#entries');function draw(){const q=document.querySelector('#search').value.toLowerCase();root.innerHTML='';data.filter(x=>(active==='all'||x.tag===active)&&(x.title+' '+x.desc).toLowerCase().includes(q)).forEach(x=>{const a=document.createElement('article');a.className='content-card';a.innerHTML='<span class="pill">'+x.tag+'</span><h2>'+x.title+'</h2><p class="muted">'+x.desc+'</p>';root.append(a)})}document.querySelector('#search').addEventListener('input',draw);document.querySelectorAll('[data-tag]').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.tag;draw()}));draw();</script></body></html>
